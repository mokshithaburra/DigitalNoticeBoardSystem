<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Digital Notice Board System</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <header class="dashboard-header">
            <div class="header-left">
                <h1>Admin Dashboard</h1>
            </div>
            <div class="header-right">
                <span class="user-info">👤 Admin User</span>
                <a href="../logout" class="btn btn-secondary btn-small">Logout</a>
            </div>
        </header>
        
        <!-- Main Content -->
        <main class="dashboard-main">
            <!-- Add Notice Section -->
            <section class="section">
                <div class="section-header">
                    <h2>Create New Notice</h2>
                </div>
                <div class="card">
                    <form class="notice-form" id="noticeForm">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="noticeTitle">Notice Title *</label>
                                <input type="text" id="noticeTitle" name="title" placeholder="Enter notice title" required>
                            </div>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="noticeDescription">Description *</label>
                                <textarea id="noticeDescription" name="description" rows="4" placeholder="Enter notice description" required></textarea>
                            </div>
                        </div>
                        
                        <div class="form-row form-row-3">
                            <div class="form-group">
                                <label for="noticeCategory">Category *</label>
                                <select id="noticeCategory" name="category" required>
                                    <option value="">Select Category</option>
                                    <option value="exam">Exam</option>
                                    <option value="event">Event</option>
                                    <option value="emergency">Emergency</option>
                                    <option value="general">General</option>
                                    <option value="academic">Academic</option>
                                    <option value="placement">Placement</option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label for="noticePriority">Priority *</label>
                                <select id="noticePriority" name="priority" required>
                                    <option value="">Select Priority</option>
                                    <option value="high">High</option>
                                    <option value="medium">Medium</option>
                                    <option value="low">Low</option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label for="noticeExpiry">Expiry Date *</label>
                                <input type="date" id="noticeExpiry" name="expiry" required>
                            </div>
                        </div>
                        
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">Create Notice</button>
                            <button type="reset" class="btn btn-secondary">Clear Form</button>
                        </div>
                    </form>
                </div>
            </section>
            
            <!-- Notices List Section -->
            <section class="section">
                <div class="section-header">
                    <h2>Manage Notices</h2>
                    <div class="section-actions">
                        <input type="text" class="search-input" placeholder="Search notices..." id="searchNotices">
                    </div>
                </div>
                
                <div class="notices-table-container">
                    <table class="notices-table">
                        <thead>
                            <tr>
                                <th>Title</th>
                                <th>Category</th>
                                <th>Priority</th>
                                <th>Created</th>
                                <th>Expires</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="noticesTableBody">
                            <tr>
                                <td colspan="7">Loading notices...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script src="../js/admin.js"></script>

</body>
</html>
